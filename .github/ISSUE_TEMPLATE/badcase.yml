name: Badcase
description: 记录一个出错或体验不好的情况
title: "[badcase] "
labels: ["badcase"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 哪个部分
      options:
        - 扫谱识别（图片读成六线谱）
        - 六线谱文本输入 / 解析
        - 练习判定 / 打分
        - 声音 / 音色
        - 竖屏练习模式
        - 谱库
        - 自由弹奏 / 和弦谱
        - 显示 / 布局
        - 其他
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际看到或听到的情况
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 应该是什么样
  - type: textarea
    id: steps
    attributes:
      label: 怎么复现
      description: 用的哪首谱、第几小节、点了什么。可以直接粘贴六线谱文本。
      placeholder: |
        1. 导入 …
        2. 第 12 小节 …
  - type: textarea
    id: media
    attributes:
      label: 截图 / 原谱图片
      description: 扫谱问题请附上原图，直接拖进来即可
  - type: input
    id: device
    attributes:
      label: 设备和浏览器
      placeholder: 例如 iPhone 15 / Safari
